
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STYLE SHOP | Boutique</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

body {
  background: #f7f7f7;
  color: #222;
}
 
header {
  background: #111;
  color: white;
  padding: 22px 7%;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.logo {
  font-size: 25px;
  font-weight: bold;
  letter-spacing: 2px;
}

header span {
  color: #e8b44c;
}

.hero {
  background: linear-gradient(#0008,#0008),
  url('https://images.unsplash.com/photo-1441986300917-64674bd600d8?w=1400')
  center/cover;
  height: 380px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  color: white;
  text-align: center;
  padding: 20px;
}

.hero h1 {
  font-size: 45px;
  margin-bottom: 15px;
}

.hero button, .buy {
  background: #e8b44c;
  color: #111;
  border: none;
  padding: 12px 25px;
  cursor: pointer;
  font-weight: bold;
  border-radius: 5px;
}

.container {
  padding: 45px 7%;
}

.section-title {
  text-align: center;
  margin-bottom: 30px;
  font-size: 30px;
}

.search {
  display: block;
  width: 100%;
  max-width: 400px;
  padding: 13px;
  margin: 0 auto 30px;
  border: 1px solid #ddd;
  border-radius: 5px;
}

.products {
  display: grid;
  grid-template-columns: repeat(auto-fit,minmax(220px,1fr));
  gap: 25px;
}

.product {
  background: white;
  border-radius: 10px;
  overflow: hidden;
  box-shadow: 0 3px 12px #0001;
  text-align: center;
  padding-bottom: 20px;
}

.product img {
  width: 100%;
  height: 260px;
  object-fit: cover;
}

.product h3 {
  margin: 15px 0 8px;
}

.price {
  color: #b88628;
  font-weight: bold;
  margin-bottom: 15px;
}

.buy:hover {
  background: #d49c30;
}

.cart {
  text-align: center;
  margin-top: 45px;
  padding: 25px;
  background: white;
  border-radius: 10px;
}

footer {
  background: #111;
  color: white;
  text-align: center;
  padding: 25px;
  margin-top: 40px;
}

@media(max-width:600px) {
  .hero h1 {font-size: 30px;}
  header {padding: 18px 5%;}
}
</style>
</head>

<body>

<header>
  <div class="logo">STYLE <span>SHOP</span></div>
  <div>🛒 Panier: <b id="count">0</b></div>
</header>

<section class="hero">
  <h1>NEW COLLECTION 2026</h1>
  <p>Découvrez votre nouveau style</p>
  <br>
  <button onclick="document.getElementById('shop').scrollIntoView()">
    SHOP NOW
  </button>
</section>

<section class="container" id="shop">
  <h2 class="section-title">NOS PRODUITS</h2>

  <input class="search" id="search"
  placeholder="Rechercher un vêtement..."
  oninput="filterProducts()">

  <div class="products" id="products"></div>

  <div class="cart">
    <h2>🛒 Mon Panier</h2>
    <p id="cartItems">Votre panier est vide</p>
    <h3 id="total">Total: 0 DH</h3>
    <br>
    <button class="buy" onclick="orderWhatsApp()">
      Commander sur WhatsApp
    </button>
  </div>
</section>

<footer>
  <p>© 2026 STYLE SHOP - Tous droits réservés</p>
  <p>Instagram | Facebook | WhatsApp</p>
</footer>

<script>
const products = [
 {
  name:"T-shirt Premium",
  price:149,
  image:"https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=500"
 },
 {
  name:"Hoodie Streetwear",
  price:249,
  image:"https://images.unsplash.com/photo-1556821840-3a63f95609a7?w=500"
 },
 {
  name:"Jean Fashion",
  price:299,
  image:"https://images.unsplash.com/photo-1542272604-787c3835535d?w=500"
 },
 {
  name:"Sneakers Style",
  price:399,
  image:"https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=500"
 },
 {
  name:"Veste Moderne",
  price:349,
  image:"https://images.unsplash.com/photo-1551028719-00167b16eac5?w=500"
 },
 {
  name:"Chemise Casual",
  price:199,
  image:"https://images.unsplash.com/photo-1596755094514-f87e34085b2c?w=500"
 }
];

let cart = [];

function displayProducts(list) {
 const container = document.getElementById("products");
 container.innerHTML = "";

 list.forEach(p => {
  container.innerHTML += `
   <div class="product">
    <img src="${p.image}" alt="${p.name}">
    <h3>${p.name}</h3>
    <p class="price">${p.price} DH</p>
    <button class="buy" onclick="addCart('${p.name}')">
     Ajouter au panier
    </button>
   </div>
  `;
 });
}

function addCart(name) {
 const product = products.find(p => p.name === name);
 cart.push(product);
 updateCart();
}

function updateCart() {
 document.getElementById("count").innerText = cart.length;

 document.getElementById("cartItems").innerHTML =
 cart.length ? cart.map(p => p.name + " - " + p.price + " DH").join("<br>") :
 "Votre panier est vide";

 const total = cart.reduce((sum,p) => sum + p.price,0);
 document.getElementById("total").innerText = "Total: " + total + " DH";
}

function filterProducts() {
 const value = document.getElementById("search").value.toLowerCase();
 displayProducts(products.filter(p => p.name.toLowerCase().includes(value)));
}

function orderWhatsApp() {
 if (!cart.length) {
  alert("Votre panier est vide !");
  return;
 }

 const phone = "212600000000"; // Remplace par ton numéro WhatsApp
 const message = "Bonjour, je veux commander :\n" +
 cart.map(p => p.name + " - " + p.price + " DH").join("\n") +
 "\nTotal: " + cart.reduce((s,p) => s+p.price,0) + " DH";

 window.open("https://wa.me/" + phone + "?text=" +
 encodeURIComponent(message), "_blank");
}

displayProducts(products);
</script>

</body>
</html>
